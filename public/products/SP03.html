<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nước Mắm Đức Lợi - Tạp Hóa Bé Lan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex flex-col min-h-full text-slate-800">

    <!-- NAVBAR ĐƠN GIẢN -->
    <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-slate-200 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 font-bold text-slate-800 text-sm hover:text-brand-600 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Về Trang Chủ
            </a>
            <span class="font-bold text-xs sm:text-sm text-slate-900">Tạp Hóa <span class="text-brand-600">Bé Lan</span></span>
        </div>
    </header>

    <!-- NỘI DUNG CHI TIẾT SẢN PHẨM -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 sm:py-10">
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
            
            <!-- HÌNH ẢNH SẢN PHẨM -->
            <div class="aspect-square bg-slate-100 rounded-2xl overflow-hidden relative shadow-inner">
                <img src="" alt="Nước Mắm Đức Lợi" class="w-full h-full object-cover">
                
                <span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow">-20%</span>
            </div>

            <!-- THÔNG TIN SẢN PHẨM -->
            <div class="flex flex-col justify-between space-y-4">
                <div class="space-y-3">
                    <span class="text-xs font-bold text-brand-600 uppercase tracking-wider bg-brand-50 px-2.5 py-1 rounded-md inline-block">Lít</span>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">Nước Mắm Đức Lợi</h1>
                    
                    <div class="flex items-baseline gap-3 pt-1">
                        <span class="text-2xl sm:text-3xl font-extrabold text-brand-600">40.000 ₫</span>
                        <span class="text-base text-slate-400 line-through">50.000 ₫</span>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 text-xs sm:text-sm text-slate-600 space-y-2">
                        <p class="font-bold text-slate-800 uppercase tracking-wider text-xs">Mô tả chi tiết:</p>
                        <p class="leading-relaxed">Chưa có mô tả cho sản phẩm này.</p>
                    </div>
                </div>

                <!-- NÚT MUA HÀNG -->
                <div class="pt-2">
                    <button onclick="addToCartAndRedirect('SP03')" class="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm sm:text-base rounded-2xl transition-all shadow-lg shadow-brand-600/25 flex items-center justify-center gap-2">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i> Thêm Vào Giỏ & Mua Ngay
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Xử lý thêm vào giỏ hàng và chuyển về trang chủ mở giỏ
        function addToCartAndRedirect(productId) {
            let cart = JSON.parse(localStorage.getItem('cart_culan')) || [];
            // Lấy thông tin từ object nhúng sẵn
            const product = {"id":"SP03","name":"Nước Mắm Đức Lợi","category":"Gia vị & Bếp","price":40000,"originalPrice":50000,"unit":"Lít","heavy":false,"image":"","description":""};
            const existItem = cart.find(item => item.id === productId);
            
            if (existItem) {
                existItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            localStorage.setItem('cart_culan', JSON.stringify(cart));
            window.location.href = '/?openCart=true';
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
